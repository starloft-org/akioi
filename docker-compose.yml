# 首次部署：
#   1. cp .env.example .env 并按注释填写（必须改 DB_PASSWORD / REDIS_PASSWORD / JWT_SECRET）
#   2. docker compose --profile sandbox build sandbox    # 构建判题沙箱镜像 akioi-sandbox:latest
#   3. docker compose up -d --build                      # 构建并启动 mysql/redis/server/judge/frontend
# 判题沙箱镜像不是常驻服务，只用于给 judge 提供隔离运行环境，因此放在 sandbox profile 下。
services:
  mysql:
    image: mysql:8.0
    container_name: akioi_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: akioi
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: akioi_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: akioi-backend:latest
    container_name: akioi_server
    restart: unless-stopped
    command: ["/app/server"]
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_ADDR: redis:6379
    expose:
      - "8080"
    volumes:
      - ./data/logs:/app/logs
      - ./data/testdata:/app/testdata
      - ./data/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  judge:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: akioi-backend:latest
    container_name: akioi_judge
    restart: unless-stopped
    command: ["/app/judge"]
    user: root
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_ADDR: redis:6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/logs:/app/logs
      - ./data/testdata:/app/testdata
      - ./data/work:/app/work
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_started

  sandbox:
    image: akioi-sandbox:latest
    build:
      context: deploy/sandbox
    profiles:
      - sandbox
    entrypoint:
      - /bin/true

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    container_name: akioi_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - server
