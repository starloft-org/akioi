resolver 127.0.0.11 valid=10s ipv6=off;

# 80 端口只做两件事：Let's Encrypt 的 HTTP-01 校验，以及把其余请求 301 到 HTTPS。
# 业务页面与接口不再通过 80 提供，明文访问一律被重定向到 https。
server {
    listen 80;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    # 证书由容器入口脚本维护：有正式证书时指向 Let's Encrypt，否则用临时自签名证书占位
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 拿到正式证书后浏览器会记住一年内只走 HTTPS
    add_header Strict-Transport-Security "max-age=31536000" always;

    set $backend_endpoint backend:8080;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1024m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        # 该 location 有自己的 add_header，需一并声明 HSTS，否则不会继承上面的设置
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://$backend_endpoint;
        proxy_http_version 1.1;
        # 大批量上传题目包时放宽读请求体与转发的超时，避免网关先断开
        client_body_timeout 600s;
        client_body_buffer_size 1m;
        send_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /uploads/ {
        proxy_pass http://$backend_endpoint;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
