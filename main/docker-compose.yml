# 主站：MySQL + Redis + 后端 API + 前端。
# 评测节点已拆分到 ../judgeserver，可部署在本机或独立机器，本文件不再包含 judge。
# 首次部署：
#   1. cp .env.example .env 并按注释填写（必须改 DB_PASSWORD / REDIS_PASSWORD / ADMIN_INIT_PASSWORD）
#   2. docker compose up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: akioi_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: akioi
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      # 评测节点自带数据库，不再连主站；保持 127.0.0.1，仅本机调试时可放开
      - "${DB_BIND_ADDR:-127.0.0.1}:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: akioi_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    ports:
      # 同 MySQL：评测节点已自带 Redis，这里保持 127.0.0.1
      - "${REDIS_BIND_ADDR:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: akioi-backend:latest
    container_name: akioi_backend
    restart: unless-stopped
    command: ["/app/server"]
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_ADDR: redis:6379
    # 测试数据与评测任务推送到评测节点的 9000 端口；后台的评测节点地址填
    # http://<judgeserver 宿主机 IP>:9000，同机部署填宿主机内网 IP，跨机部署填对方地址。
    expose:
      - "8080"
    volumes:
      - ./data/logs:/app/logs
      - ./data/testdata:/app/testdata
      - ./data/uploads:/app/uploads
      - ./data/backups:/app/backups
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: akioi_frontend
    restart: unless-stopped
    ports:
      # 前端以 HTTP 监听宿主机 3000，HTTPS 由外层反向代理（如 1Panel）终止。
      # 反向代理的上游填 http://127.0.0.1:3000 即可；改端口时改 FRONTEND_PORT 并同步改上游。
      # 若反向代理就在本机，可把映射改成 127.0.0.1:3000:80，避免 3000 直接暴露到公网。
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
