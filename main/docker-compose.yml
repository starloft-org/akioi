# 主站：MySQL + Redis + 后端 API + 前端。
# 评测节点已拆分到 ../judgeserver，可部署在本机或独立机器，本文件不再包含 judge。
# 首次部署：
#   1. cp .env.example .env 并按注释填写（必须改 DB_PASSWORD / REDIS_PASSWORD / JWT_SECRET）
#   2. docker compose up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: akioi_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: akioi
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      # 同机部署的评测节点从容器内经 host.docker.internal 访问，DB_BIND_ADDR 需设为 0.0.0.0
      # 或宿主机内网 IP；跨机部署同样改为内网 IP，并用防火墙把来源限制为评测机。
      - "${DB_BIND_ADDR:-127.0.0.1}:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: akioi_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    ports:
      # 同 MySQL：同机评测节点需经宿主机访问，改 REDIS_BIND_ADDR 为 0.0.0.0 或内网 IP。
      - "${REDIS_BIND_ADDR:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: akioi-backend:latest
    container_name: akioi_backend
    restart: unless-stopped
    command: ["/app/server"]
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_ADDR: redis:6379
    # 测试数据推送到评测节点时走宿主机端口，docker 网桥内无法解析宿主机名，
    # 因此显式映射 host.docker.internal；后台的评测节点地址填 http://host.docker.internal:9100。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    volumes:
      - ./data/logs:/app/logs
      - ./data/testdata:/app/testdata
      - ./data/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: akioi_frontend
    restart: unless-stopped
    ports:
      # 直接占用宿主机 80，浏览器用 http://域名/ 即可访问，不需要反向代理和证书。
      # 若宿主机 80 已被其它服务占用（例如系统自带的 nginx），改 FRONTEND_PORT 为 3001
      # 并交给上层反向代理转发。
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
