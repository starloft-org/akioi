# 主站：MySQL + Redis + 后端 API + 前端。
# 评测节点已拆分到 ../judgeserver，可部署在本机或独立机器，本文件不再包含 judge。
# 首次部署：
#   1. cp .env.example .env 并按注释填写（必须改 DB_PASSWORD / REDIS_PASSWORD / ADMIN_INIT_PASSWORD）
#   2. docker compose up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: akioi_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: akioi
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      # 评测节点自带数据库，不再连主站；保持 127.0.0.1，仅本机调试时可放开
      - "${DB_BIND_ADDR:-127.0.0.1}:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: akioi_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    ports:
      # 同 MySQL：评测节点已自带 Redis，这里保持 127.0.0.1
      - "${REDIS_BIND_ADDR:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: akioi-backend:latest
    container_name: akioi_backend
    restart: unless-stopped
    command: ["/app/server"]
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_ADDR: redis:6379
    # 测试数据与评测任务推送到评测节点的 9000 端口；后台的评测节点地址填
    # http://<judgeserver 宿主机 IP>:9000，同机部署填宿主机内网 IP，跨机部署填对方地址。
    expose:
      - "8080"
    volumes:
      - ./data/logs:/app/logs
      - ./data/testdata:/app/testdata
      - ./data/uploads:/app/uploads
      - ./data/backups:/app/backups
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: akioi_frontend
    restart: unless-stopped
    ports:
      # 80 只保留 ACME 证书校验与 301 跳转，业务一律走 443。
      # 证书由容器启动时自动向 Let's Encrypt 申请（需要 DOMAIN / ACME_EMAIL），
      # 之后每 12 小时检查续期；还没有正式证书时先用临时自签名证书占位。
      # 80 必须保持映射，否则 Let's Encrypt 的 HTTP-01 校验无法完成。
      - "${FRONTEND_PORT:-80}:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CERT_NAME: ${CERT_NAME:-akioi}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-0}
    volumes:
      # 证书与续期状态要持久化，重建容器时不必重复申请（避免触发 Let's Encrypt 频率限制）
      - ./data/letsencrypt:/etc/letsencrypt
      - ./data/certbot-webroot:/var/www/certbot
    depends_on:
      - backend
