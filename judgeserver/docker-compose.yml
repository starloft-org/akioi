# 评测节点：自带 MySQL 与 Redis，不再访问主站的数据库与队列。
# 与主站之间只有 HTTP：接收测试数据与评测任务，回传评测结果。
# 首次部署：
#   1. cp .env.example .env 并填写 DB_PASSWORD / REDIS_PASSWORD / MAIN_BASE_URL / JUDGE_SYNC_SECRET / HOST_TESTDATA_DIR / HOST_WORK_DIR
#   2. docker compose --profile sandbox build sandbox    # 构建判题沙箱镜像 akioi-sandbox:latest
#   3. docker compose up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: akioi_judge_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-akioi_judge}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: akioi_judge_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  judge:
    build:
      context: ./backend
    image: akioi-judge:latest
    container_name: akioi_judge
    restart: unless-stopped
    user: root
    env_file: .env
    environment:
      # 覆盖 .env 里的连接地址，指向本机这套容器
      DB_HOST: mysql
      REDIS_ADDR: redis:6379
    # 只在回传评测结果时访问主站，走宿主机网关
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/logs:/app/logs
      - ./data/testdata:/app/testdata
      - ./data/work:/app/work
    ports:
      # 主站推送测试数据与评测任务使用。宿主机端口固定 9000，
      # 主站侧把节点地址配成 http://<本品宿主机 IP>:9000 即可，同机、跨机一致。
      - "${JUDGE_LISTEN_PORT:-9000}:9000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  sandbox:
    image: akioi-sandbox:latest
    build:
      context: ./sandbox
    profiles:
      - sandbox
    entrypoint:
      - /bin/true
